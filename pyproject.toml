[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xx-code"
version = "0.1.0"
description = "基于 LangGraph 的多 Agent 编码助手"
requires-python = ">=3.13"
# 依赖刻意为空：真实依赖见 requirements.txt。
# 这样 `pip install -e .` 只安装本项目，不会去动现有环境里的包。
dependencies = []

[project.scripts]
# 安装后即可直接敲 `xx-code`（不用再 python -m code_agent.cli）
xx-code = "code_agent.cli:main"

[tool.setuptools]
packages = ["code_agent", "code_agent.tools"]
